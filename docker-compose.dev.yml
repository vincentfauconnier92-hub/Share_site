# Overrides de développement — monter le code source et activer le hot-reload.
# Usage : docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  backend:
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
